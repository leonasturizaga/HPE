spring:
  application:
    name: hpe-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

# Render (and most PaaS providers) inject PORT at runtime; default to 8080 for local dev.
server:
  port: ${PORT:8080}

app:
  cors:
    # Comma-separated list of allowed frontend origins. Overridden per-environment
    # (see application-local.yml / application-prod.yml) and ultimately by the
    # FRONTEND_ORIGIN env var set in the Render dashboard for deployed environments.
    allowed-origins: ${FRONTEND_ORIGIN:http://localhost:5173}
