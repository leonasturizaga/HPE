spring.application.name=hpe-backend
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# Render (and most PaaS providers) inject PORT at runtime; default to 8080 for local dev.
server.port=${PORT:8080}

# Comma-separated list of allowed frontend origins. Overridden per-environment
# (see application-local.properties / application-prod.properties) and
# ultimately by the FRONTEND_ORIGIN env var set in the Render dashboard for
# deployed environments.
app.cors.allowed-origins=${FRONTEND_ORIGIN:http://localhost:5173}
