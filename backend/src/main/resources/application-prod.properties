logging.level.root=INFO
logging.level.com.hpe.backend=INFO

# No default on purpose: production must set FRONTEND_ORIGIN explicitly in the
# Render dashboard (Environment tab). If it's missing, startup fails fast with
# a clear "could not resolve placeholder 'FRONTEND_ORIGIN'" error instead of
# silently allowing the wrong origin or none at all.
app.cors.allowed-origins=${FRONTEND_ORIGIN}
